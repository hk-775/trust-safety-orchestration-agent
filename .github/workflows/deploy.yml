name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        required: true
        default: dev
        options:
          - dev
          - staging
          - prodtest
      aws_region:
        description: AWS region
        type: string
        required: true
        default: us-east-1
      deploy_frontend:
        description: Build and publish the frontend
        type: boolean
        required: true
        default: true
      seed_demo_data:
        description: Seed demo data (dev/staging only)
        type: boolean
        required: true
        default: false

concurrency:
  group: trust-safety-${{ inputs.environment }}
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read # Required for checkout.
      id-token: write # Required only for the AWS OIDC credential exchange below.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.7"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: trust-safety-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Verify backend
        run: |
          uv run ruff check lambdas/ scripts/delete_stack.py scripts/live_simulator.py scripts/seed_demo_data.py
          uv run pytest lambdas/tests/ -q
          sam validate --lint --region "${AWS_REGION}"

      - name: Deploy
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ inputs.aws_region }}
          STACK_NAME: trust-safety-orch-${{ inputs.environment }}
          USE_REDIS: ${{ inputs.environment == 'prodtest' && 'true' || 'false' }}
          DEPLOY_FRONTEND: ${{ inputs.deploy_frontend }}
          SEED_DEMO_DATA: ${{ inputs.seed_demo_data }}
          CONFIRM_PRODUCTION_DEPLOY: ${{ inputs.environment == 'prodtest' && 'true' || 'false' }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          ALLOWED_CORS_ORIGIN: ${{ vars.ALLOWED_CORS_ORIGIN }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
        run: ./scripts/deploy.sh
