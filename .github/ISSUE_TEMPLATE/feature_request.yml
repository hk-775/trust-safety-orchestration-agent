name: Feature request
description: Propose a focused improvement to the sample
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: aws_impact
    attributes:
      label: AWS impact
      description: Note expected IAM, networking, resource, or cost changes.
