        - !Ref "AWS::NoValue"
      Policies:
        - !Ref SafetyAgentBasePolicy
        - !If [EnableRedis, !Ref SafetyAgentVpcPolicy, !Ref "AWS::NoValue"]
        - DynamoDBReadPolicy:
            TableName: !Ref CasesTable
        - DynamoDBReadPolicy:
            TableName: !Ref EvidenceMetadataTable
        - S3ReadPolicy:
            BucketName: !Ref EvidenceStoreBucket
      Events:
        GetEvidence:
          Type: Api
