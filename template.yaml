AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::LanguageExtensions
  - AWS::Serverless-2016-10-31
Description: >
  Reference implementation for event-driven trust and safety orchestration on AWS.
  Demonstrates detection, investigation, policy routing, human review, and enforcement integration.

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 256
    Architectures:
      - arm64
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !If [IsProdLike, "INFO", "DEBUG"]
        CASES_TABLE: !Ref CasesTable
        EVIDENCE_METADATA_TABLE: !Ref EvidenceMetadataTable
        AUDIT_LOGS_TABLE: !Ref AuditLogsTable
        BLOCKLIST_TABLE: !Ref BlocklistTable
        CONFIG_TABLE: !Ref ConfigTable
        REVIEW_QUEUE_TABLE: !Ref ReviewQueueTable
        METRICS_TABLE: !Ref MetricsTable
        REVIEWER_STATE_TABLE: !Ref ReviewerStateTable
        ANOMALY_SCORES_TABLE: !Ref AnomalyScoresTable
        APPEALS_TABLE: !Ref AppealsTable
        WEBSOCKET_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
        EVIDENCE_BUCKET: !Ref EvidenceStoreBucket
        AUDIT_ARCHIVE_BUCKET: !Ref AuditArchiveBucket
        CONFIG_BACKUPS_BUCKET: !Ref ConfigBackupsBucket
        REDIS_ENDPOINT: !If [EnableRedis, !GetAtt RedisCluster.RedisEndpoint.Address, ""]
        REDIS_PORT: !If [EnableRedis, !GetAtt RedisCluster.RedisEndpoint.Port, ""]
        USE_REDIS: !Ref UseRedis
        ALLOWED_CORS_ORIGIN: !Ref AllowedCorsOrigin
        NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
        BEHAVIORAL_STREAM_NAME: !Ref BehavioralEventsStream
        WEBSOCKET_API_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prodtest, prod]

  AllowedCorsOrigin:
    Type: String
    Default: http://localhost:3000
    AllowedPattern: ^https?://[^[:space:]]+$
    ConstraintDescription: Must be one HTTP or HTTPS origin without spaces

  AcknowledgeIncompleteProduction:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Explicit confirmation that the production deployment checklist was completed

  PlatformUserApiUrl:
    Type: String
    Default: https://internal-api.example.com/users
    AllowedPattern: ^https://.+
    ConstraintDescription: Must be an HTTPS URL

  PlatformMessagingApiUrl:
    Type: String
    Default: https://internal-api.example.com/messages
    AllowedPattern: ^https://.+
    ConstraintDescription: Must be an HTTPS URL

  PlatformAuthMode:
    Type: String
    Default: none
    AllowedValues: [none, api-key, bearer]
    Description: Authentication scheme used by the platform user and messaging APIs

  PlatformAuthSecretArn:
    Type: String
    Default: ""
    AllowedPattern: ^$|^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$
    ConstraintDescription: Must be an AWS Secrets Manager secret ARN or empty

  PlatformAuthKmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: ^$|^arn:[^:]+:kms:[^:]+:[0-9]{12}:key/.+$
    ConstraintDescription: Must be the customer-managed KMS key ARN for the platform secret or empty

  BedrockModelId:
    Type: String
    Default: ""
    Description: Optional for dev/staging; required explicitly by the prodtest deployment path

  PartnerIntelApiUrl:
    Type: String
    Default: https://intel-api.partner-network.internal
    AllowedPattern: ^https://.+
    ConstraintDescription: Must be an HTTPS URL

  PartnerIntelAuthMode:
    Type: String
    Default: none
    AllowedValues: [none, api-key, bearer]
    Description: Authentication scheme used by the partner intelligence API

  PartnerIntelAuthSecretArn:
    Type: String
    Default: ""
    AllowedPattern: ^$|^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$
    ConstraintDescription: Must be an AWS Secrets Manager secret ARN or empty

  PartnerIntelAuthKmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: ^$|^arn:[^:]+:kms:[^:]+:[0-9]{12}:key/.+$
    ConstraintDescription: Must be the customer-managed KMS key ARN for the partner secret or empty

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.1.0/24

  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.2.0/24

  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.101.0/24

  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.102.0/24

  RedisNodeType:
    Type: String
    Default: cache.t3.medium

  UseRedis:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: "Set to true to deploy VPC and Redis resources; false disables Redis-dependent features for dev/demo"

Rules:
  PlatformAuthConfiguration:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref PlatformAuthMode, none]
            - !Equals [!Ref PlatformAuthSecretArn, ""]
          - !And
            - !Not [!Equals [!Ref PlatformAuthMode, none]]
            - !Not [!Equals [!Ref PlatformAuthSecretArn, ""]]
        AssertDescription: Platform auth mode and secret ARN must be configured together
      - Assert: !Or
          - !Equals [!Ref PlatformAuthKmsKeyArn, ""]
          - !Not [!Equals [!Ref PlatformAuthSecretArn, ""]]
        AssertDescription: Platform KMS key ARN requires a platform secret ARN

  PartnerIntelAuthConfiguration:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref PartnerIntelAuthMode, none]
            - !Equals [!Ref PartnerIntelAuthSecretArn, ""]
          - !And
            - !Not [!Equals [!Ref PartnerIntelAuthMode, none]]
            - !Not [!Equals [!Ref PartnerIntelAuthSecretArn, ""]]
        AssertDescription: Partner auth mode and secret ARN must be configured together
      - Assert: !Or
          - !Equals [!Ref PartnerIntelAuthKmsKeyArn, ""]
          - !Not [!Equals [!Ref PartnerIntelAuthSecretArn, ""]]
        AssertDescription: Partner KMS key ARN requires a partner secret ARN

  ProductionPublicationGuard:
    RuleCondition: !Equals [!Ref Environment, prod]
    Assertions:
      - Assert: !Equals [!Ref AcknowledgeIncompleteProduction, "true"]
        AssertDescription: Production deployments require explicit checklist confirmation

  ProductionTopologyConfiguration:
    RuleCondition: !Or
      - !Equals [!Ref Environment, prodtest]
      - !Equals [!Ref Environment, prod]
    Assertions:
      - Assert: !Equals [!Ref UseRedis, "true"]
        AssertDescription: Production-like deployments must enable Redis

  ProductionIntegrationConfiguration:
    RuleCondition: !Equals [!Ref Environment, prod]
    Assertions:
      - Assert: !Not
          - !Equals [!Ref PlatformUserApiUrl, https://internal-api.example.com/users]
        AssertDescription: Production deployments require a platform user API URL
      - Assert: !Not
          - !Equals [!Ref PlatformMessagingApiUrl, https://internal-api.example.com/messages]
        AssertDescription: Production deployments require a platform messaging API URL
      - Assert: !Not
          - !Equals [!Ref PartnerIntelApiUrl, https://intel-api.partner-network.internal]
        AssertDescription: Production deployments require a partner intelligence API URL
      - Assert: !Not
          - !Equals [!Ref PlatformAuthMode, none]
        AssertDescription: Production deployments require platform API authentication
      - Assert: !Not
          - !Equals [!Ref PlatformAuthSecretArn, ""]
        AssertDescription: Production deployments require a platform API secret ARN
      - Assert: !Not
          - !Equals [!Ref PartnerIntelAuthMode, none]
        AssertDescription: Production deployments require partner intelligence authentication
      - Assert: !Not
          - !Equals [!Ref PartnerIntelAuthSecretArn, ""]
        AssertDescription: Production deployments require a partner intelligence secret ARN

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  IsProdTest: !Equals [!Ref Environment, prodtest]
  IsProdLike: !Or
    - !Equals [!Ref Environment, prodtest]
    - !Equals [!Ref Environment, prod]
  EnableRedis: !Equals [!Ref UseRedis, "true"]
  EnableRedisAndProdLike: !And
    - !Equals [!Ref UseRedis, "true"]
    - !Or
      - !Equals [!Ref Environment, prodtest]
      - !Equals [!Ref Environment, prod]
  HasPlatformAuthSecret: !Not [!Equals [!Ref PlatformAuthSecretArn, ""]]
  HasPartnerIntelAuthSecret: !Not [!Equals [!Ref PartnerIntelAuthSecretArn, ""]]
  HasPlatformAuthKmsKey: !Not [!Equals [!Ref PlatformAuthKmsKeyArn, ""]]
  HasPartnerIntelAuthKmsKey: !Not [!Equals [!Ref PartnerIntelAuthKmsKeyArn, ""]]

# =============================================================================
# REST API Gateway
# =============================================================================
Resources:

  ProdTestMockApi:
    Type: AWS::Serverless::Api
    Condition: IsProdTest
    Properties:
      Name: safetyagent-prodtest-upstream-mock
      StageName: mock
      EndpointConfiguration:
        Type: REGIONAL
      DefinitionBody:
        swagger: '2.0'
        info:
          title: SafetyAgent prodtest upstream mock
          version: '1.0'
        paths:
          /{proxy+}:
            x-amazon-apigateway-any-method:
              parameters:
                - name: proxy
                  in: path
                  required: true
                  type: string
              responses:
                '200':
                  description: Empty mock response
                  schema:
                    type: object
              x-amazon-apigateway-integration:
                type: mock
                passthroughBehavior: when_no_templates
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: '{}'

  SafetyAgentApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "safetyagent-api-${Environment}"
      StageName: !Ref Environment
      TracingEnabled: true
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
        AddDefaultAuthorizerToCorsPreflight: false
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key'"
        AllowOrigin: !Sub "'${AllowedCorsOrigin}'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedCorsOrigin}'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedCorsOrigin}'"
      Models:
        AnomalyAnalyzeRequest:
          type: object
          required: [user_ids]
          properties:
            user_ids:
              type: array
              items:
                type: string
        EnforcementExecuteRequest:
          type: object
          required: [case_id, action, violation_type, confidence_score]
          properties:
            case_id:
              type: string
            action:
              type: string
            violation_type:
              type: string
            confidence_score:
              type: number
        BulkEnforcementRequest:
          type: object
          required: [case_id, user_ids, action, violation_type]
          properties:
            case_id:
              type: string
            user_ids:
              type: array
              items:
                type: string
              maxItems: 500
            action:
              type: string
            violation_type:
              type: string
        AppealRequest:
          type: object
          required: [enforcement_id, appeal_reason]
          properties:
            enforcement_id:
              type: string
            appeal_reason:
              type: string
            supporting_info:
              type: string
        CrisisResourcesRequest:
          type: object
          required: [user_id, crisis_type, case_id]
          properties:
            user_id:
              type: string
            crisis_type:
              type: string
            case_id:
              type: string

# =============================================================================
# WebSocket API Gateway
# =============================================================================

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "safetyagent-ws-${Environment}"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Environment
      AutoDeploy: true

  WebSocketAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref WebSocketApi
      AuthorizerType: REQUEST
      AuthorizerResultTtlInSeconds: 0
      AuthorizerUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketAuthorizerFunction.Arn}/invocations"
      IdentitySource:
        - route.request.querystring.ticket
      Name: !Sub "safetyagent-ws-ticket-${Environment}"

  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$connect"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref WebSocketAuthorizer
      Target: !Sub "integrations/${WebSocketConnectIntegration}"

  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$disconnect"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketDisconnectIntegration}"

  WebSocketDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$default"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketDefaultIntegration}"

  WebSocketConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketHandlerFunction.Arn}/invocations"

  WebSocketDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketHandlerFunction.Arn}/invocations"

  WebSocketDefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketHandlerFunction.Arn}/invocations"

  WebSocketHandlerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketHandlerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WebSocketAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/authorizers/*"

# =============================================================================
# Cognito User Pool
# =============================================================================

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "safetyagent-users-${Environment}"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: "OPTIONAL"
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints:
            MaxLength: "50"

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "safetyagent-client-${Environment}"
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED

# =============================================================================
# VPC & Networking
# =============================================================================

  VPC:
    Type: AWS::EC2::VPC
    Condition: EnableRedis
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "safetyagent-vpc-${Environment}"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: EnableRedis
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "safetyagent-igw-${Environment}"

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: EnableRedis
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Condition: EnableRedis
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "safetyagent-public-1-${Environment}"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Condition: EnableRedis
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "safetyagent-public-2-${Environment}"

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Condition: EnableRedis
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "safetyagent-private-1-${Environment}"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Condition: EnableRedis
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "safetyagent-private-2-${Environment}"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: EnableRedis
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "safetyagent-public-${Environment}"

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    Condition: EnableRedis
    DependsOn: VPCGatewayAttachment
    Metadata:
      guard:
        # Required for private-subnet egress through the NAT gateways.
        SuppressedRules:
          - NO_UNRESTRICTED_ROUTE_TO_IGW
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: EnableRedis
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: EnableRedis
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NatEip1:
    Type: AWS::EC2::EIP
    Condition: EnableRedis
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Condition: EnableRedis
    Properties:
      AllocationId: !GetAtt NatEip1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "safetyagent-nat-1-${Environment}"

  NatEip2:
    Type: AWS::EC2::EIP
    Condition: EnableRedisAndProdLike
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Condition: EnableRedisAndProdLike
    Properties:
      AllocationId: !GetAtt NatEip2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub "safetyagent-nat-2-${Environment}"

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Condition: EnableRedis
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "safetyagent-private-1-${Environment}"

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Condition: EnableRedis
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "safetyagent-private-2-${Environment}"

  PrivateSubnet1DefaultRoute:
    Type: AWS::EC2::Route
    Condition: EnableRedis
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PrivateSubnet2DefaultRoute:
    Type: AWS::EC2::Route
    Condition: EnableRedis
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [EnableRedisAndProdLike, !Ref NatGateway2, !Ref NatGateway1]

  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Condition: EnableRedis
    Properties:
      Description: Subnet group for Redis
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: EnableRedis
    Properties:
      GroupDescription: Security group for Redis
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: EnableRedis
    Properties:
      GroupDescription: Security group for Lambda functions
      VpcId: !Ref VPC

  DynamoDBVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: EnableRedis
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2

  S3VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: EnableRedis
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: EnableRedis
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: EnableRedis
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

# =============================================================================
# ElastiCache Redis (only when UseRedis=true)
# =============================================================================

  RedisCluster:
    Type: AWS::ElastiCache::CacheCluster
    Condition: EnableRedis
    Properties:
      ClusterName: !Sub "safetyagent-redis-${Environment}"
      Engine: redis
      CacheNodeType: !Ref RedisNodeType
      NumCacheNodes: 1
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      VpcSecurityGroupIds:
        - !Ref RedisSecurityGroup
      EngineVersion: "7.0"
      AutoMinorVersionUpgrade: true
      SnapshotRetentionLimit: !If [IsProdLike, 7, 1]

# =============================================================================
# DynamoDB Tables — Core Operational Data
# =============================================================================

  CasesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Metadata:
      guard:
        # The sample uses DynamoDB's AWS-owned encryption key. Production is
        # blocked until adopters decide whether their policy requires a CMK.
        SuppressedRules:
          - DYNAMODB_TABLE_ENCRYPTED_KMS
    Properties:
      TableName: !Sub "tg-cases-${Environment}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: case_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: case_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_id-status-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: status-created_at-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EvidenceMetadataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Metadata:
      guard:
        # See the documented production KMS decision in docs/deployment.md.
        SuppressedRules:
          - DYNAMODB_TABLE_ENCRYPTED_KMS
    Properties:
      TableName: !Sub "tg-evidence-metadata-${Environment}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: case_id
          AttributeType: S
