# =============================================================================
# S3 Buckets
# =============================================================================

  AccessLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Metadata:
      guard:
        # A logging destination cannot log to itself.
        SuppressedRules:
          - S3_BUCKET_LOGGING_ENABLED
    Properties:
      BucketName: !Sub "tg-access-logs-${Environment}-${AWS::Region}-${AWS::AccountId}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      guard:
        # The registry rule requires Resource "*"; these equivalent statements
        # intentionally scope the deny to this bucket and its objects.
        SuppressedRules:
          - S3_BUCKET_SSL_REQUESTS_ONLY
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AccessLogsBucket.Arn
              - !Sub "${AccessLogsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: AllowS3ServerAccessLogs
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${AccessLogsBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3:::tg-*-${Environment}-${AWS::Region}-${AWS::AccountId}"

  EvidenceStoreBucket:
    Type: AWS::S3::Bucket
    DependsOn: AccessLogsBucketPolicy
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BucketName: !Sub "tg-evidence-store-${Environment}-${AWS::Region}-${AWS::AccountId}"
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: !Sub "${Environment}/evidence/"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  EvidenceStoreBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      guard:
        # The registry rule requires Resource "*"; these equivalent statements
        # intentionally scope the deny to this bucket and its objects.
        SuppressedRules:
          - S3_BUCKET_SSL_REQUESTS_ONLY
    Properties:
      Bucket: !Ref EvidenceStoreBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt EvidenceStoreBucket.Arn
              - !Sub "${EvidenceStoreBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  AuditArchiveBucket:
    Type: AWS::S3::Bucket
    DependsOn: AccessLogsBucketPolicy
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BucketName: !Sub "tg-audit-archive-${Environment}-${AWS::Region}-${AWS::AccountId}"
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: !Sub "${Environment}/audit/"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveToGlacier
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 365
            ExpirationInDays: 2920

  AuditArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      guard:
        # The registry rule requires Resource "*"; these equivalent statements
        # intentionally scope the deny to this bucket and its objects.
        SuppressedRules:
          - S3_BUCKET_SSL_REQUESTS_ONLY
    Properties:
      Bucket: !Ref AuditArchiveBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AuditArchiveBucket.Arn
              - !Sub "${AuditArchiveBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  ConfigBackupsBucket:
    Type: AWS::S3::Bucket
    DependsOn: AccessLogsBucketPolicy
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BucketName: !Sub "tg-config-backups-${Environment}-${AWS::Region}-${AWS::AccountId}"
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: !Sub "${Environment}/config/"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ConfigBackupsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      guard:
        # The registry rule requires Resource "*"; these equivalent statements
        # intentionally scope the deny to this bucket and its objects.
        SuppressedRules:
          - S3_BUCKET_SSL_REQUESTS_ONLY
    Properties:
      Bucket: !Ref ConfigBackupsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ConfigBackupsBucket.Arn
              - !Sub "${ConfigBackupsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  FrontendBucket:
    Type: AWS::S3::Bucket
    DependsOn: AccessLogsBucketPolicy
    Properties:
      BucketName: !Sub "tg-frontend-${Environment}-${AWS::Region}-${AWS::AccountId}"
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: !Sub "${Environment}/frontend/"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      guard:
        # The registry rule requires Resource "*"; these equivalent statements
        # intentionally scope the deny to this bucket and its objects.
        SuppressedRules:
          - S3_BUCKET_SSL_REQUESTS_ONLY
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub "${FrontendBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

# =============================================================================
# CloudFront Distribution
# =============================================================================

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "safetyagent-oac-${Environment}-${AWS::Region}-${AWS::AccountId}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendSpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "safetyagent-spa-${Environment}-${AWS::Region}-${AWS::AccountId}"
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite client-side routes to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var lastSegment = uri.substring(uri.lastIndexOf('/') + 1);

          if (uri.charAt(uri.length - 1) === '/' || lastSegment.indexOf('.') === -1) {
            request.uri = '/index.html';
          }

          return request;
        }

  FrontendSecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "safetyagent-headers-${Environment}-${AWS::Region}-${AWS::AccountId}"
        Comment: Security headers for the SafetyAgent dashboard and API proxy
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub >-
              default-src 'self'; base-uri 'self'; object-src 'none';
              frame-ancestors 'none'; form-action 'self';
              connect-src 'self' wss://*.execute-api.${AWS::Region}.${AWS::URLSuffix};
              img-src 'self' data:; font-src 'self' data:;
              script-src 'self'; style-src 'self' 'unsafe-inline'
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: same-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=()
              Override: true

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "SafetyAgent Dashboard - ${Environment}"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: S3FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiGatewayOrigin
            DomainName: !Sub "${SafetyAgentApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: !Sub "/${Environment}"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref FrontendSecurityHeadersPolicy
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FrontendSpaRewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: https-only
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref FrontendSecurityHeadersPolicy
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true

# =============================================================================
# Kinesis Stream
# =============================================================================

  BehavioralEventsStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub "tg-behavioral-events-${Environment}"
