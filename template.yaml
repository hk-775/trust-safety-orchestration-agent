            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/intelligence/ingest
            Method: POST
        PublishIntelligence:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/intelligence/publish
            Method: POST

  MetricsHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-metrics-handler-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.metrics_handler.lambda_handler
      Timeout: 10
      VpcConfig: !If
        - EnableRedis
        - SecurityGroupIds: [!Ref LambdaSecurityGroup]
          SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
        - !Ref "AWS::NoValue"
      Policies:
        - !Ref SafetyAgentBasePolicy
        - !If [EnableRedis, !Ref SafetyAgentVpcPolicy, !Ref "AWS::NoValue"]
        - DynamoDBReadPolicy:
            TableName: !Ref MetricsTable
        - DynamoDBReadPolicy:
            TableName: !Ref CasesTable
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewQueueTable
        - DynamoDBReadPolicy:
            TableName: !Ref AuditLogsTable
      Events:
        RealtimeMetrics:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/metrics/realtime
            Method: GET
        PrometheusMetrics:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/metrics
            Method: GET
        RecentActions:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/actions/recent
            Method: GET

  AuthHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-auth-handler-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.auth_handler.lambda_handler
      Timeout: 10
      Environment:
        Variables:
          USER_POOL_ID: !Ref CognitoUserPool
          CLIENT_ID: !Ref CognitoUserPoolClient
          WEBSOCKET_TICKETS_TABLE: !Ref WebSocketTicketsTable
      Policies:
        - !Ref SafetyAgentBasePolicy
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:AdminGetUser
              Resource: !GetAtt CognitoUserPool.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt WebSocketTicketsTable.Arn
      Events:
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/auth/login
            Method: POST
            Auth:
              Authorizer: NONE
        WebSocketTicket:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/auth/websocket-ticket
            Method: POST

  HealthHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-health-handler-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.health_handler.lambda_handler
      Timeout: 10
      VpcConfig: !If
        - EnableRedis
        - SecurityGroupIds: [!Ref LambdaSecurityGroup]
          SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
        - !Ref "AWS::NoValue"
      Environment:
        Variables:
          PLATFORM_USER_API_URL: !If
            - IsProdTest
            - !Sub "https://${ProdTestMockApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/mock/users"
            - !Ref PlatformUserApiUrl
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - !Ref SafetyAgentBasePolicy
        - !If [EnableRedis, !Ref SafetyAgentVpcPolicy, !Ref "AWS::NoValue"]
        - DynamoDBReadPolicy:
            TableName: !Ref CasesTable
      Events:
        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/health
            Method: GET
            Auth:
              Authorizer: NONE

  AppealHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-appeal-handler-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.appeal_handler.lambda_handler
      Timeout: 10
      Policies:
        - !Ref SafetyAgentBasePolicy
        - DynamoDBCrudPolicy:
            TableName: !Ref AppealsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewQueueTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NotificationQueue.QueueName
      Events:
        SubmitAppeal:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/appeals
            Method: POST

  CrisisHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-crisis-handler-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.crisis_handler.lambda_handler
      Timeout: 15
      Policies:
        - !Ref SafetyAgentBasePolicy
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewQueueTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NotificationQueue.QueueName
      Events:
        SendCrisisResources:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/crisis/resources
            Method: POST

  AuditHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-audit-handler-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.audit_handler.lambda_handler
      Timeout: 30
      Policies:
        - !Ref SafetyAgentBasePolicy
        - DynamoDBReadPolicy:
            TableName: !Ref AuditLogsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MetricsTable
        - DynamoDBReadPolicy:
            TableName: !Ref CasesTable
        - S3CrudPolicy:
            BucketName: !Ref AuditArchiveBucket
      Events:
        ExportAudit:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/audit/export
            Method: GET
        ComplianceReport:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/reports/compliance
            Method: GET

  ReviewerHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-reviewer-handler-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.reviewer_handler.lambda_handler
      Timeout: 10
      Policies:
        - !Ref SafetyAgentBasePolicy
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewerStateTable
      Events:
        ExposureMetrics:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/reviewers/{reviewerId}/exposure-metrics
            Method: GET

  WebSocketHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-websocket-handler-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.websocket_handler.lambda_handler
      Timeout: 10
      # This function needs public egress for the API Gateway Management API
      # and does not use Redis, so it intentionally runs outside the VPC.
      Policies:
        - !Ref SafetyAgentBasePolicy
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnectionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MetricsTable
        - DynamoDBReadPolicy:
            TableName: !Ref CasesTable
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewQueueTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WebSocketAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-websocket-authorizer-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.websocket_authorizer.lambda_handler
      Timeout: 5
      Environment:
        Variables:
          WEBSOCKET_TICKETS_TABLE: !Ref WebSocketTicketsTable
      Policies:
        - !Ref SafetyAgentBasePolicy
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource: !GetAtt WebSocketTicketsTable.Arn

# =============================================================================
# Lambda Functions — Event Processors
# =============================================================================

  BehavioralProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-behavioral-processor-${Environment}"
      CodeUri: lambdas/
      Handler: processors.behavioral_processor.lambda_handler
      Timeout: 60
      MemorySize: 512
      VpcConfig: !If
        - EnableRedis
        - SecurityGroupIds: [!Ref LambdaSecurityGroup]
          SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
        - !Ref "AWS::NoValue"
      Environment:
        Variables:
          INVESTIGATION_STATE_MACHINE_ARN: !Ref InvestigationStateMachine
      Policies:
        - !Ref SafetyAgentBasePolicy
        - !If [EnableRedis, !Ref SafetyAgentVpcPolicy, !Ref "AWS::NoValue"]
        - DynamoDBCrudPolicy:
            TableName: !Ref AnomalyScoresTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigTable
        - KinesisStreamReadPolicy:
            StreamName: !Ref BehavioralEventsStream
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt InvestigationStateMachine.Name
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt OperationsAlertTopic.TopicName
      Events:
        BehavioralStream:
          Type: Kinesis
          Properties:
            Stream: !GetAtt BehavioralEventsStream.Arn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 5
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            FunctionResponseTypes:
              - ReportBatchItemFailures

  ProfileProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-profile-processor-${Environment}"
      CodeUri: lambdas/
      Handler: processors.profile_processor.lambda_handler
      Timeout: 15
      VpcConfig: !If
        - EnableRedis
        - SecurityGroupIds: [!Ref LambdaSecurityGroup]
          SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
        - !Ref "AWS::NoValue"
      Environment:
        Variables:
          PLATFORM_USER_API_URL: !If
            - IsProdTest
            - !Sub "https://${ProdTestMockApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/mock/users"
            - !Ref PlatformUserApiUrl
          PLATFORM_AUTH_MODE: !Ref PlatformAuthMode
          PLATFORM_AUTH_SECRET_ARN: !Ref PlatformAuthSecretArn
      Policies:
        - !Ref SafetyAgentBasePolicy
        - !If [EnableRedis, !Ref SafetyAgentVpcPolicy, !Ref "AWS::NoValue"]
        - !If [HasPlatformAuthSecret, !Ref PlatformIntegrationSecretReadPolicy, !Ref "AWS::NoValue"]
        - DynamoDBReadPolicy:
            TableName: !Ref BlocklistTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable

  BulkDetectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-bulk-detector-${Environment}"
      CodeUri: lambdas/
      Handler: processors.bulk_detector.lambda_handler
      Timeout: 60
      MemorySize: 512
      VpcConfig: !If
        - EnableRedis
        - SecurityGroupIds: [!Ref LambdaSecurityGroup]
          SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
        - !Ref "AWS::NoValue"
      Environment:
        Variables:
          BULK_ACTION_STATE_MACHINE_ARN: !Ref BulkActionStateMachine
      Policies:
        - !Ref SafetyAgentBasePolicy
        - !If [EnableRedis, !Ref SafetyAgentVpcPolicy, !Ref "AWS::NoValue"]
        - DynamoDBReadPolicy:
            TableName: !Ref MetricsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogsTable
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt BulkActionStateMachine.Name
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt OperationsAlertTopic.TopicName

  NotificationProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-notification-processor-${Environment}"
      CodeUri: lambdas/
      Handler: processors.notification_processor.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          PLATFORM_USER_API_URL: !If
            - IsProdTest
            - !Sub "https://${ProdTestMockApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/mock/users"
            - !Ref PlatformUserApiUrl
          PLATFORM_AUTH_MODE: !Ref PlatformAuthMode
          PLATFORM_AUTH_SECRET_ARN: !Ref PlatformAuthSecretArn
      Policies:
        - !Ref SafetyAgentBasePolicy
        - !If [HasPlatformAuthSecret, !Ref PlatformIntegrationSecretReadPolicy, !Ref "AWS::NoValue"]
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogsTable
      Events:
        NotificationQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

# =============================================================================
# Lambda Functions — Step Function Tasks
# =============================================================================

  EvidenceAssemblerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-evidence-assembler-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.evidence_assembler.lambda_handler
      Timeout: 60
      MemorySize: 512
      VpcConfig: !If
        - EnableRedis
        - SecurityGroupIds: [!Ref LambdaSecurityGroup]
          SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
        - !Ref "AWS::NoValue"
      Environment:
        Variables:
          PLATFORM_USER_API_URL: !If
            - IsProdTest
            - !Sub "https://${ProdTestMockApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/mock/users"
            - !Ref PlatformUserApiUrl
          PLATFORM_MESSAGING_API_URL: !If
            - IsProdTest
            - !Sub "https://${ProdTestMockApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/mock/messages"
            - !Ref PlatformMessagingApiUrl
          PLATFORM_AUTH_MODE: !Ref PlatformAuthMode
          PLATFORM_AUTH_SECRET_ARN: !Ref PlatformAuthSecretArn
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - !Ref SafetyAgentBasePolicy
        - !If [EnableRedis, !Ref SafetyAgentVpcPolicy, !Ref "AWS::NoValue"]
        - !If [HasPlatformAuthSecret, !Ref PlatformIntegrationSecretReadPolicy, !Ref "AWS::NoValue"]
        - DynamoDBCrudPolicy:
            TableName: !Ref EvidenceMetadataTable
        - DynamoDBReadPolicy:
            TableName: !Ref BlocklistTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - S3CrudPolicy:
            BucketName: !Ref EvidenceStoreBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"

  ConfidenceCalculatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-confidence-calculator-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.confidence_calculator.lambda_handler
      Timeout: 10
      Policies:
        - !Ref SafetyAgentBasePolicy
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigTable

  PolicyRouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-policy-router-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.policy_router.lambda_handler
      Timeout: 10
      Policies:
        - !Ref SafetyAgentBasePolicy
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigTable

  EnforcementExecutorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-enforcement-executor-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.enforcement_executor.lambda_handler
      Timeout: 30
      VpcConfig: !If
        - EnableRedis
        - SecurityGroupIds: [!Ref LambdaSecurityGroup]
          SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
        - !Ref "AWS::NoValue"
      Environment:
        Variables:
          PLATFORM_USER_API_URL: !If
            - IsProdTest
            - !Sub "https://${ProdTestMockApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/mock/users"
            - !Ref PlatformUserApiUrl
          PLATFORM_AUTH_MODE: !Ref PlatformAuthMode
          PLATFORM_AUTH_SECRET_ARN: !Ref PlatformAuthSecretArn
      Policies:
        - !Ref SafetyAgentBasePolicy
        - !If [EnableRedis, !Ref SafetyAgentVpcPolicy, !Ref "AWS::NoValue"]
        - !If [HasPlatformAuthSecret, !Ref PlatformIntegrationSecretReadPolicy, !Ref "AWS::NoValue"]
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BlocklistTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AppealsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NotificationQueue.QueueName

  EscalationHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-escalation-handler-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.escalation_handler.lambda_handler
      Timeout: 15
      Policies:
        - !Ref SafetyAgentBasePolicy
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewQueueTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigTable

# =============================================================================
# CloudWatch Alarms
# =============================================================================

  HighErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "tg-high-error-rate-${Environment}"
      AlarmDescription: Error rate exceeds 5% across SafetyAgent functions
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref BehavioralProcessorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CriticalAlertTopic

  InvestigationDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "tg-investigation-duration-${Environment}"
      AlarmDescription: Investigation workflow exceeding 15 minute SLA
      Namespace: AWS/States
      MetricName: ExecutionTime
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref InvestigationStateMachine
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 900000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationsAlertTopic

  ReviewQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "tg-review-queue-depth-${Environment}"
      AlarmDescription: Review queue depth exceeds 1000
      Namespace: SafetyAgent
      MetricName: ReviewQueueDepth
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationsAlertTopic

  EnforcementQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "tg-enforcement-queue-depth-${Environment}"
      AlarmDescription: Enforcement queue exceeds 1000 pending actions
      Namespace: SafetyAgent
      MetricName: EnforcementQueueDepth
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationsAlertTopic

# =============================================================================
# Outputs
# =============================================================================

Outputs:
  ProdTestMockApiUrl:
    Condition: IsProdTest
    Description: Temporary upstream mock used only by the prodtest rehearsal
    Value: !Sub "https://${ProdTestMockApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/mock"

  RestApiUrl:
    Description: SafetyAgent REST API URL
    Value: !Sub "https://${SafetyAgentApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  WebSocketUrl:
    Description: SafetyAgent WebSocket URL
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool

  CognitoClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient

  InvestigationStateMachineArn:
    Description: Investigation workflow state machine ARN
    Value: !Ref InvestigationStateMachine

  BulkActionStateMachineArn:
    Description: Bulk action workflow state machine ARN
    Value: !Ref BulkActionStateMachine

  EvidenceBucketName:
    Description: Evidence store S3 bucket
    Value: !Ref EvidenceStoreBucket

  AuditBucketName:
    Description: Audit archive S3 bucket
    Value: !Ref AuditArchiveBucket

  ConfigBackupsBucketName:
    Description: Configuration backups S3 bucket
    Value: !Ref ConfigBackupsBucket

  AccessLogsBucketName:
    Description: S3 server access logs bucket
    Value: !Ref AccessLogsBucket

  CloudFrontDomainName:
    Description: CloudFront distribution domain name
    Value: !GetAtt CloudFrontDistribution.DomainName

  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !Ref CloudFrontDistribution

  FrontendBucketName:
    Description: Frontend hosting S3 bucket
    Value: !Ref FrontendBucket
