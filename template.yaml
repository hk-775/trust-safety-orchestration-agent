      RetentionPeriodHours: 24
      StreamEncryption:
        EncryptionType: KMS
        KeyId: alias/aws/kinesis

# =============================================================================
# SQS Queues
# =============================================================================

  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "tg-notifications-${Environment}"
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDLQ.Arn
        maxReceiveCount: 3
      KmsMasterKeyId: alias/aws/sqs

  NotificationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "tg-notifications-dlq-${Environment}"
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs

  InvestigationTriggerQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "tg-investigation-trigger-${Environment}"
      VisibilityTimeout: 120
      KmsMasterKeyId: alias/aws/sqs

