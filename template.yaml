            - !Ref PlatformUserApiUrl
          PLATFORM_AUTH_MODE: !Ref PlatformAuthMode
          PLATFORM_AUTH_SECRET_ARN: !Ref PlatformAuthSecretArn
      Policies:
        - !Ref SafetyAgentBasePolicy
        - !If [EnableRedis, !Ref SafetyAgentVpcPolicy, !Ref "AWS::NoValue"]
        - !If [HasPlatformAuthSecret, !Ref PlatformIntegrationSecretReadPolicy, !Ref "AWS::NoValue"]
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BlocklistTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AppealsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NotificationQueue.QueueName
      Events:
        ExecuteEnforcement:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/enforcement/execute
            Method: POST
        BulkEnforcement:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/enforcement/bulk
            Method: POST

  ConfigHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-config-handler-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.config_handler.lambda_handler
      Timeout: 10
      Policies:
        - !Ref SafetyAgentBasePolicy
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogsTable
        - S3CrudPolicy:
            BucketName: !Ref ConfigBackupsBucket
      Events:
        UpdateThresholds:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/config/thresholds
            Method: PUT
        GetConfig:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/config/current
            Method: GET
        RollbackConfig:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/config/rollback
            Method: POST

  ReviewHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-review-handler-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.review_handler.lambda_handler
      Timeout: 15
      VpcConfig: !If
        - EnableRedis
        - SecurityGroupIds: [!Ref LambdaSecurityGroup]
          SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
        - !Ref "AWS::NoValue"
      Environment:
        Variables:
          PLATFORM_USER_API_URL: !If
            - IsProdTest
            - !Sub "https://${ProdTestMockApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/mock/users"
            - !Ref PlatformUserApiUrl
          PLATFORM_AUTH_MODE: !Ref PlatformAuthMode
          PLATFORM_AUTH_SECRET_ARN: !Ref PlatformAuthSecretArn
      Policies:
        - !Ref SafetyAgentBasePolicy
        - !If [EnableRedis, !Ref SafetyAgentVpcPolicy, !Ref "AWS::NoValue"]
        - !If [HasPlatformAuthSecret, !Ref PlatformIntegrationSecretReadPolicy, !Ref "AWS::NoValue"]
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewQueueTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogsTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "${EvidenceStoreBucket.Arn}/*"
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !GetAtt EvidenceStoreBucket.Arn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NotificationQueue.QueueName
      Events:
        GetReviewQueue:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/review-queue
            Method: GET
        SubmitDecision:
          Type: Api
          Properties:
            RestApiId: !Ref SafetyAgentApi
            Path: /api/v1/cases/{caseId}/decision
            Method: POST

  IntelligenceHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "tg-intelligence-handler-${Environment}"
      CodeUri: lambdas/
      Handler: handlers.intelligence_handler.lambda_handler
      Timeout: 15
      Environment:
        Variables:
          PARTNER_NETWORK_INTEL_API_URL: !If
            - IsProdTest
            - !Sub "https://${ProdTestMockApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/mock/partner"
            - !Ref PartnerIntelApiUrl
          PARTNER_INTEL_AUTH_MODE: !Ref PartnerIntelAuthMode
          PARTNER_INTEL_AUTH_SECRET_ARN: !Ref PartnerIntelAuthSecretArn
      Policies:
        - !Ref SafetyAgentBasePolicy
        - !If [HasPartnerIntelAuthSecret, !Ref PartnerIntelSecretReadPolicy, !Ref "AWS::NoValue"]
        - DynamoDBCrudPolicy:
            TableName: !Ref BlocklistTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogsTable
      Events:
        IngestIntelligence:
          Type: Api
