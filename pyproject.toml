[project]
name = "trust-safety-orchestration-agent"
version = "1.0.0"
description = "Reference implementation for trust and safety orchestration on AWS"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "redis>=5.0.0",
    "ulid-py>=1.1.0",
    "pydantic>=2.5.0",
    "urllib3>=2.7.0,<3",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8.6",
    "pip-audit>=2.9.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "moto>=5.0",
    "ruff>=0.4.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "pip-audit>=2.9.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "moto>=5.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["lambdas/tests"]
